name: Build AdaDo Browser (Linux + Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 2026-10-25 (Claude, Dan: "could you not build this in github so not
      # taking up disk space"): standard trick -- GitHub's ubuntu-latest
      # image ships ~50GB of preinstalled toolchains nobody here needs
      # (Android SDK, .NET, GHC, extra docker images). Removing them frees
      # real usable space on the SAME disk, before the build ever starts.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "After:"; df -h /

      # 2026-10-25 (Claude, Dan live: "theres probably an sdk that has
      # them... to have run first for dependencies?"): depot_tools'
      # gclient is the real, authoritative way Chromium fetches every
      # build-time third_party dependency (rust toolchain, pinned
      # cpython3, sysroots, llvm-build, etc.) via DEPS hooks -- using it
      # instead of guessing at individual missing pieces one at a time.
      # It's just scripts, not a large download.
      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          echo "/tmp/depot_tools" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build pkg-config \
            libnss3-dev libasound2-dev build-essential

      # 2026-10-25 (Claude): real failure found on the first attempt --
      # gn's own bootstrap source uses std::expected (C++23), and the
      # runner's system clang/gcc either wasn't picked up or didn't
      # support it in the mode gn's bootstrap invoked it in ("14 errors
      # generated... ninja: build stopped" compiling tools/gn/src/gn/err.h).
      # Install a known-current LLVM/clang explicitly and point gn's
      # bootstrap at it via CC/CXX rather than relying on autodetection.
      - name: Install a modern clang toolchain
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          clang++ --version
          echo '#include <expected>' | clang++-18 -std=c++23 -stdlib=libc++ -x c++ -c - -o /tmp/expected_check.o && echo "libc++ <expected> OK"

      # 2026-10-25 (Claude): second real failure -- clang-18 was correctly
      # selected, but <expected> still didn't resolve ("unknown template
      # name 'expected'"), because clang defaults to the SYSTEM libstdc++
      # (GCC's standard library) unless told otherwise, and that lookup
      # was failing here. Forcing clang's own libc++-18 explicitly via
      # CXXFLAGS/LDFLAGS sidesteps the ambiguity entirely.
      # 2026-10-25 (Claude): caching the downloaded pinned Chromium source
      # across retries -- the single biggest fixed cost per iteration while
      # we're still finding real toolchain/hook gaps, not worth re-paying
      # every time.
      - name: Cache downloaded Chromium source
        uses: actions/cache@v4
        with:
          path: build/work/download_cache
          key: chromium-src-${{ hashFiles('downloads.ini') }}

      - name: Run the real build pipeline (ADADO-671)
        env:
          BUILD_ROOT: ${{ github.workspace }}/build/work
          JOBS: 2
          CC: clang-18
          CXX: clang++-18
          CXXFLAGS: -stdlib=libc++
          LDFLAGS: -stdlib=libc++
        run: |
          df -h /
          bash tools/build-adado-browser.sh

      - name: Package the real build output
        if: success()
        run: |
          mkdir -p artifact
          cp build/work/src/out/Default/chrome artifact/
          cp build/work/src/out/Default/chrome_100_percent.pak artifact/ || true
          cp build/work/src/out/Default/chrome_200_percent.pak artifact/ || true
          cp build/work/src/out/Default/icudtl.dat artifact/ || true
          cp build/work/src/out/Default/resources.pak artifact/ || true
          cp build/work/src/out/Default/v8_context_snapshot.bin artifact/ || true
          cp -r build/work/src/out/Default/locales artifact/ || true

      - name: Upload real build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adado-browser-chrome-linux
          path: artifact/
          retention-days: 14

      - name: Report disk space on failure
        if: failure()
        run: df -h /

  # 2026-10-25 (Claude, Dan live: "we should make a windows and linux
  # version at same time"): separate, independent job -- runs in true
  # parallel on its own GitHub-hosted machine, so it can never slow down
  # or risk the Linux job above. This is a FIRST attempt, not yet
  # verified end to end -- expect real Windows-specific gaps the same
  # way Linux needed several rounds to find its own (toolchain/
  # dependency fetching, not disk space, given this is a separate
  # runner with its own clean disk).
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install depot_tools
        shell: bash
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          echo "/tmp/depot_tools" >> "$GITHUB_PATH"

      - name: Cache downloaded Chromium source
        uses: actions/cache@v4
        with:
          path: build/work/download_cache
          key: chromium-src-windows-${{ hashFiles('downloads.ini') }}

      - name: Run the real build pipeline (ADADO-671, Windows)
        shell: bash
        env:
          BUILD_ROOT: ${{ github.workspace }}/build/work
          JOBS: 2
        run: |
          bash tools/build-adado-browser-windows.sh

      - name: Package the real build output
        if: success()
        shell: bash
        run: |
          mkdir -p artifact
          cp build/work/src/out/Default/chrome.exe artifact/ || true
          cp build/work/src/out/Default/chrome_100_percent.pak artifact/ || true
          cp build/work/src/out/Default/chrome_200_percent.pak artifact/ || true
          cp build/work/src/out/Default/icudtl.dat artifact/ || true
          cp build/work/src/out/Default/resources.pak artifact/ || true
          cp -r build/work/src/out/Default/locales artifact/ || true

      - name: Upload real build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adado-browser-chrome-windows
          path: artifact/
          retention-days: 14
